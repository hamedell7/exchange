name: exchange-identity

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exchange-identity:local
    container_name: identity-service
    restart: unless-stopped
    environment:
      APP_NAME: identity
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8001}
      IDENTITY_USERS_READ_TOKEN: ${IDENTITY_USERS_READ_TOKEN:-}
      LOG_CHANNEL: stderr
      HASH_DRIVER: ${HASH_DRIVER:-argon2id}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-identity_db}
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-local_identity_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    # Development: live source on the host, Linux dependencies in a Docker volume.
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: volume
        source: identity_vendor
        target: /var/www/html/vendor
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - exchange-network

volumes:
  identity_vendor:

networks:
  exchange-network:
    external: true
    name: exchange-network
