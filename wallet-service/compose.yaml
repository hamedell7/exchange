name: exchange-wallet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exchange-wallet:local
    container_name: wallet-service
    restart: unless-stopped
    environment:
      APP_NAME: wallet
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8004}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wallet_db}
      DB_USERNAME: ${DB_USERNAME:-wallet_app}
      DB_PASSWORD: ${DB_PASSWORD:-local_wallet_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    # Development: live source on the host, Linux dependencies in a Docker volume.
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: volume
        source: wallet_vendor
        target: /var/www/html/vendor
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - exchange-network

volumes:
  wallet_vendor:

networks:
  exchange-network:
    external: true
    name: exchange-network
