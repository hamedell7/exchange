name: exchange-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: exchange_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Missing POSTGRES_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - exchange-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Missing REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exchange-network

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Missing RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Missing RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - exchange-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: exchange-api-gateway:local
    container_name: exchange-api-gateway
    restart: unless-stopped
    environment:
      IDENTITY_SERVICE_HOST: ${IDENTITY_SERVICE_HOST:-identity-service}
      IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-8000}
      TRADING_SERVICE_HOST: ${TRADING_SERVICE_HOST:-trading-service}
      TRADING_SERVICE_PORT: ${TRADING_SERVICE_PORT:-8000}
      WALLET_SERVICE_HOST: ${WALLET_SERVICE_HOST:-wallet-service}
      WALLET_SERVICE_PORT: ${WALLET_SERVICE_PORT:-8000}
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - exchange-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  exchange-network:
    name: exchange-network
    driver: bridge
