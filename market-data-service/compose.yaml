name: exchange-market-data
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exchange-market-data:local
    container_name: market-data-service
    restart: unless-stopped
    environment:
      APP_NAME: market-data
      APP_ENV: \${APP_ENV:-local}
      APP_DEBUG: \${APP_DEBUG:-true}
      APP_URL: \${APP_URL:-http://localhost:8003}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: \${DB_DATABASE:-market_data_db}
      DB_USERNAME: \${DB_USERNAME:-market_data_app}
      DB_PASSWORD: \${DB_PASSWORD:-local_market_data_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: app
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: \${REVERB_APP_ID:-}
      REVERB_APP_KEY: \${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: \${REVERB_APP_SECRET:-}
      CMC_API_KEY: \${CMC_API_KEY:-}
      CMC_BASE_URL: \${CMC_BASE_URL:-https://pro-api.coinmarketcap.com}
      CMC_HTTP_TIMEOUT: \${CMC_HTTP_TIMEOUT:-30}
      NOBITEX_BASE_URL: \${NOBITEX_BASE_URL:-https://apiv2.nobitex.ir}
      NOBITEX_WS_URL: \${NOBITEX_WS_URL:-wss://ws.nobitex.ir/connection/websocket}
      NOBITEX_HTTP_TIMEOUT: \${NOBITEX_HTTP_TIMEOUT:-15}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: volume
        source: market_data_vendor
        target: /var/www/html/vendor
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:8082:8080"
    networks:
      - exchange-network

  scheduler:
    image: exchange-market-data:local
    container_name: market-data-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
    environment:
      APP_NAME: market-data
      APP_ENV: \${APP_ENV:-local}
      APP_DEBUG: \${APP_DEBUG:-true}
      APP_URL: \${APP_URL:-http://localhost:8003}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: \${DB_DATABASE:-market_data_db}
      DB_USERNAME: \${DB_USERNAME:-market_data_app}
      DB_PASSWORD: \${DB_PASSWORD:-local_market_data_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: app
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: \${REVERB_APP_ID:-}
      REVERB_APP_KEY: \${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: \${REVERB_APP_SECRET:-}
      NOBITEX_BASE_URL: \${NOBITEX_BASE_URL:-https://apiv2.nobitex.ir}
      NOBITEX_WS_URL: \${NOBITEX_WS_URL:-wss://ws.nobitex.ir/connection/websocket}
      NOBITEX_HTTP_TIMEOUT: \${NOBITEX_HTTP_TIMEOUT:-15}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: volume
        source: market_data_vendor
        target: /var/www/html/vendor
    networks:
      - exchange-network

  streamer:
    image: exchange-market-data:local
    container_name: market-data-streamer
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "market:stream-nobitex", "--limit=250"]
    depends_on:
      - app
    environment:
      APP_NAME: market-data
      APP_ENV: \${APP_ENV:-local}
      APP_DEBUG: \${APP_DEBUG:-true}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: \${DB_DATABASE:-market_data_db}
      DB_USERNAME: \${DB_USERNAME:-market_data_app}
      DB_PASSWORD: \${DB_PASSWORD:-local_market_data_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: app
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: \${REVERB_APP_ID:-}
      REVERB_APP_KEY: \${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: \${REVERB_APP_SECRET:-}
      NOBITEX_BASE_URL: \${NOBITEX_BASE_URL:-https://apiv2.nobitex.ir}
      NOBITEX_WS_URL: \${NOBITEX_WS_URL:-wss://ws.nobitex.ir/connection/websocket}
      NOBITEX_HTTP_TIMEOUT: \${NOBITEX_HTTP_TIMEOUT:-15}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: volume
        source: market_data_vendor
        target: /var/www/html/vendor
    networks:
      - exchange-network

volumes:
  market_data_vendor:
networks:
  exchange-network:
    external: true
    name: exchange-network
