name: exchange-trading

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exchange-trading:local
    container_name: trading-service
    restart: unless-stopped
    environment:
      APP_NAME: trading
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8002}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: trading_db
      DB_USERNAME: trading_app
      DB_PASSWORD: ${DB_PASSWORD:-local_trading_dev}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exchange-network
      - database-network

  db:
    image: postgres:17-alpine
    container_name: trading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_trading_dev}
    volumes:
      - trading_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_app -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database-network

volumes:
  trading_postgres_data:

networks:
  exchange-network:
    external: true
    name: exchange-network
  database-network:
    internal: true
