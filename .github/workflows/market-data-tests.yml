name: Market Data tests

on:
  push:
    paths:
      - "market-data-service/**"
      - "platform/infrastructure/**"
      - "platform/api-gateway/**"
      - "platform/docs/architecture/service-boundaries.md"
      - ".github/workflows/market-data-tests.yml"
  pull_request:
    paths:
      - "market-data-service/**"
      - "platform/infrastructure/**"
      - "platform/api-gateway/**"
      - "platform/docs/architecture/service-boundaries.md"
      - ".github/workflows/market-data-tests.yml"

permissions:
  contents: read

jobs:
  market-data-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: market_data_test
          POSTGRES_USER: market_data
          POSTGRES_PASSWORD: market_data_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_data -d market_data_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, pdo_pgsql, pdo_sqlite, zip
          coverage: none

      - name: Prepare environment
        working-directory: market-data-service
        run: cp .env.example .env

      - name: Validate Composer configuration
        working-directory: market-data-service
        run: composer validate --strict

      - name: Install dependencies
        working-directory: market-data-service
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        working-directory: market-data-service
        run: php artisan key:generate --force

      - name: Run tests
        working-directory: market-data-service
        env:
          APP_ENV: testing
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'market_data_test' || ':memory:' }}
          DB_USERNAME: market_data
          DB_PASSWORD: market_data_test_password
          DB_URL: ""
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          CMC_API_KEY: test-api-key
        run: php artisan test
